services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ivf_scout
      POSTGRES_USER: ivf_scout
      POSTGRES_PASSWORD: ivf_scout
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivf_scout -d ivf_scout"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
